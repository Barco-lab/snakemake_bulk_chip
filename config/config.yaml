# =====================================================================
#  snakemake_bulk_chip 配置（ChIP-seq / CUT&Tag 等；ATAC-seq 请用 snakemake_bulk_atac）
#  默认配置，所有项目共用，一般不要直接修改。
#  运行时用 run.sh -c <项目配置> 指定项目配置（不存在时以本文件为模板生成），
#  项目配置中的参数覆盖这里的值；每次运行实际使用的配置会存档到 <outdir>/logs/run_<时间>/config.yaml
# =====================================================================

# 样本表（相对 outdir）。run.sh 会根据 fastq 目录自动生成
samples: samples.tsv

# 物种：references 中的一个 key
genome: mm10

# 默认 peak 类型；samples.tsv 的 peak_type 列可按样本覆盖
#   narrow: 转录因子、H3K4me3、H3K27ac 等
#   broad : H3K27me3、H3K9me3、H3K36me3、H3K79me2 等
peak_type: narrow

# 污染检查：把 reads 再比对到另一个物种，只报告比对率
contamination:
  enabled: false
  genome: hg38             # references 中的 key，需要填写 bowtie2_index


# ---------------------------------------------------------------------
# 软件环境（已有 conda 环境的路径）
# ---------------------------------------------------------------------
envs:
  main: /opt/anaconda/envs/in202506             # trim_galore bowtie2 samtools fastqc multiqc homer
  macs3: /home/LAB/lab_ab_1/.conda/envs/omics   # macs3 deeptools bedtools samtools
fastqc_java: /usr/bin/java   # in202506 自带的 java 损坏，FastQC 改用系统 java；留空则用环境默认

# 每个任务使用的线程数；总并发由 run.sh -j 控制
threads:
  default: 2
  trim: 4
  fastqc: 2
  align: 16
  filter: 8
  deeptools: 8
  motif: 8
samtools_sort_mem: 2G        # samtools sort 每线程内存

# ---------------------------------------------------------------------
# 参考基因组（bowtie2 index 与 blacklist 的染色体命名必须一致，流程会自动检查）
#   fasta : HOMER motif 使用
#   gtf   : 生成 TSS 用于 TSS profile / enrichment
#   fasta / gtf 与 RNA 流程同源（Ensembl，命名为 1 / MT），使用时自动与 index 命名（chr1 / chrM）互转
#   chrX / y_region : 性别检查用（index 命名），见 replicates.sex_check
#     y_region 为 chrY 上计数的区域 = chrY 去掉 PAR（拟常染色体区，X / Y 上序列相同，雌性 reads 也会比对上）后的部分
#       mm10 : PAR 为 chrY:90745845-91644698（UCSC），PAR 起点上游约 10 kb 处雌性样本也有大量 reads，
#              故截在 90 Mb（距 PAR 约 745 kb 余量，按实测数据定的经验值，非注释）
#       hg38 : PAR1 为 chrY:10001-2781479，PAR2 为 chrY:56887903-57217415（UCSC），取两者之间
#     该区域并非只含 Y 特有序列：仍有与 chrX 同源的扩增序列（小鼠 Sly / Ssty 与 X 上的 Slx / Sstx，人的 XTR），
#     经 filter.mapq 过滤后雌性样本仍有少量 reads（mm10 实测约占全部比对 reads 的 0.0001%–0.0007%），故按阈值判定
# ---------------------------------------------------------------------
references:
  mm10:
    bowtie2_index: /data/index/bowtie2/mm10/mm10
    fasta: /data/genome/Mus_musculus.GRCm38.dna.primary_assembly.fa
    gtf: /data/genome/release-100/Mus_musculus.GRCm38.100.gtf
    blacklist: /home/LAB/lab_ab_1/project/reference/blacklist/mm10-blacklist.v2.bed.gz
    effective_genome_size: 2652783500
    chrX: chrX
    y_region: "chrY:1-90000000"                  # chrY 去掉 PAR 及其上游约 745 kb
  hg38:
    bowtie2_index: ""        # 本机暂无，需要时自行构建（bowtie2-build）后填写
    fasta: /data/genome/Homo_sapiens.GRCh38.dna.primary_assembly.fa
    gtf: /data/genome/release-100/Homo_sapiens.GRCh38.100.gtf
    blacklist: /home/LAB/lab_ab_1/project/reference/blacklist/hg38-blacklist.v2.bed.gz
    effective_genome_size: 2913022398
    chrX: chrX
    y_region: "chrY:2781480-56887902"            # PAR1 与 PAR2 之间（UCSC hg38）

# ---------------------------------------------------------------------
# 各步骤参数
# ---------------------------------------------------------------------
trim:
  params: "--quality 20 --max_n 4 --length 30 --phred33"

bowtie2:                   # PE 自动追加 --no-mixed --no-discordant
  params: "-N 1"

filter:
  mapq: 30                 # 替代旧版的 grep -v "XS:i:"
  mito_name: chrM
  remove_mito: false       # true 时去除线粒体 reads

macs3:
  qvalue: 0.01
  chip_control: "--keep-dup all"                                            # 有 input/IgG 对照
  chip_no_control: "--keep-dup all --nomodel --nolambda --extsize 200 --min-length 100"  # 无对照（旧版参数）
  broad: "--broad --broad-cutoff 0.1"

bigwig:
  binsize: 10
  # 归一化，可写一个或多个（列表），每种生成一份 {sample}.{方式}.bw；第一个用于 QC 图（TSS profile、meta gene）
  #   RPGC | CPM | RPKM | BPM | None：bamCoverage --normalizeUsing
  #   deseq2_peaks      -> {sample}.SFpeaks.bw：DESeq2 size factor（consensus peak 计数，需 replicates.enabled）
  #   deseq2_background -> {sample}.SFbg.bw   ：DESeq2 size factor（全基因组 background_bin 大小的 bin 计数）
  #   size factor 为 median-of-ratios（假设大多数区域在样本间不变），只做 IP 样本；值见 04_bigwig/size_factors.{SFpeaks,SFbg}.tsv
  normalize: [RPGC]       # 如 [RPGC, CPM, deseq2_peaks]
  background_bin: 10000   # deseq2_background 的 bin 宽（bp）
  se_fragment_length: 200  # SE 数据 --extendReads 的长度
  extra: ""
  # 每组一个 bigwig（results/04_bigwig/groups/{group}.{方式}.bw），单样本的 bigwig 照常生成
  #   只做IP 样本的组（对照不合并）；样本表 merge 列为 no 的重复不参与，剩下 ≥ 2 个重复的组才生成
  group:
    enabled: true
    method: merge          # merge：合并组内去重后的 BAM 再 bamCoverage（参数同上；reads 多的重复权重大）
                           # mean ：各重复的 bigwig 逐 bin 取平均（bigwigAverage；每个重复权重相同）

qc:
  tss_profile: true        # TSS profile 与 TSS enrichment
  # computeMatrix 命令（-S / -R / --samplesLabel / -p / -o 由流程补上）
  tss_matrix: "computeMatrix reference-point -a 3000 -b 3000 --binSize 50 --skipZeros"
  # meta gene profile：protein_coding 基因 TSS 到 TES（每个样本一张图；有组 bigwig 时每组再一张）
  #   两端按真实距离各取 3 kb；TSS 下游 1 kb 不缩放（保留启动子峰形），其余基因体缩放到 5 kb
  metagene_profile: true
  metagene_min_length: 2000  # 只用长度 ≥ 该值的基因（短基因拉伸后 TSS、TES 两端的信号混在一起）
  metagene_matrix: "computeMatrix scale-regions -b 3000 -a 3000 --regionBodyLength 5000 --unscaled5prime 1000 --binSize 50 --skipZeros"

# 重复一致性（QC 报告「重复一致性」一节），只比较 IP 样本（被用作 control 的样本不参与）
#   分组见 samples.tsv 的 group 列，为空时按样本名去掉 _repN 推断；同一组的 IP 样本 peak_type 须一致
replicates:
  enabled: true
  min_reps: 2              # reproducible peak：在组内至少几个重复中出现（组内只有 2 个重复时即两者都有）
  # consensus peak 与计数用 DiffBind：组内 consensus（dba.peakset，至少 min_reps 个重复）-> 各组并集 -> dba.count
  summits: 200             # dba.count 以峰顶 ± summits bp 计数（固定宽度）；有 broad 的组时自动不用；false 保留原宽度
  method: pearson          # pearson | spearman；基于 consensus peak 上 IP 计数的 log2(CPM + 1)（不扣除 input）
  pca_top: 500             # PCA 使用方差最大的 peak 数
  # 性别（所有样本，含 control）：chrX、chrY 的 reads 占全部比对 reads（过滤去重后的 BAM）的比例
  #   chrY 只统计 references 中的 y_region（chrY 去掉 PAR），按 y_frac 阈值判定
  #   chrX 占比随抗体、细胞类型变化，只在组内比较、不用于判定；input 为全基因组 DNA，其 chrX 占比直接反映 X 拷贝数
  # 组间 Venn：各组 reproducible peak（只有 1 个样本的组用该样本的 peak）覆盖碱基；每项为 2–4 个组（group 名），每项一张小图
  #   留空时：共 2–4 个组就全部放在一张图里；超过 4 组不画
  group_venn: []           # 如 [[CBP_KA, CBP_NE, CBP_Saline], [p300_KA, p300_NE, p300_Saline]]
  sex_check: true
  y_frac: [0.002, 0.01]    # y_region reads 占全部比对 reads 的百分比：< 0.002% 判为雌性，> 0.01% 判为雄性，之间无法判断
                           # （阈值按 ATAC 雌性数据定，未用雄性样本验证）

motif:
  enabled: false           # HOMER，仅对 narrow peak 的非 control 样本
  size: 200                # summit ± size/2
  params: "-nomotif"       # 默认只做已知 motif；改为 "" 同时做 de novo（长度 8/10/12，每个样本约 1–2 小时）

keep:
  trimmed_fastq: false     # false 时 trim 后的 fastq 在比对完成后自动删除
  raw_bam: false           # false 时只保留过滤去重后的 BAM
